name: Build and test macOS app

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build, sign, and run smoke tests
        run: ./Scripts/test.sh

      - name: Archive app bundle
        run: ditto -c -k --sequesterRsrc --keepParent "build/启动台.app" "build/ClassicLaunchpad-$RUNNER_ARCH.zip"

      - name: Upload app bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ClassicLaunchpad-${{ runner.arch }}
          path: build/ClassicLaunchpad-${{ runner.arch }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
